<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Vantage Ridge Technologies{% endblock %}</title>
  <meta name="description" content="{% block description %}Vantage Ridge Technologies — a multi-cloud IT solutions consultancy: cloud infrastructure, security, DevSecOps, custom apps, and applied AI automation.{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <nav class="wrap">
      <a class="brand" href="{{ url_for('main.index') }}">Vantage <span>Ridge</span> Technologies</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Home</a></li>
        <li><a href="{{ url_for('main.services') }}" class="{{ 'active' if request.endpoint == 'main.services' }}">Services</a></li>
        <li><a href="{{ url_for('main.case_studies') }}" class="{{ 'active' if request.endpoint == 'main.case_studies' }}">Case Studies</a></li>
        <li><a href="{{ url_for('main.contact') }}" class="{{ 'active' if request.endpoint == 'main.contact' }}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; 2026 Vantage Ridge Technologies Inc.</span>
      <span><a href="mailto:hello@vantageridgetech.com">hello@vantageridgetech.com</a></span>
    </div>
  </footer>

  <!-- AI site assistant -->
  <button id="chat-launcher" aria-label="Open chat assistant" aria-expanded="false" aria-controls="chat-panel">
    <svg class="avatar-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="20" fill="#0f1b2e"/>
      <circle cx="20" cy="16" r="6.5" fill="#4fd1c5"/>
      <path d="M6 34c1.8-7.2 8-11 14-11s12.2 3.8 14 11" fill="#4fd1c5"/>
    </svg>
  </button>
  <div id="chat-panel" role="dialog" aria-label="Vantage Ridge assistant">
    <div class="chat-head">
      <div class="chat-head__identity">
        <svg class="chat-head__avatar avatar-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#0f1b2e"/>
          <circle cx="20" cy="16" r="6.5" fill="#4fd1c5"/>
          <path d="M6 34c1.8-7.2 8-11 14-11s12.2 3.8 14 11" fill="#4fd1c5"/>
        </svg>
        <div>
          <strong>Ask Vantage Ridge</strong>
          <span>AI Assistant &middot; usually replies instantly</span>
        </div>
      </div>
      <button id="chat-close" aria-label="Close chat">&times;</button>
    </div>
    <div id="chat-messages"></div>
    <form id="chat-form" class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Tell us what you're working on&hellip;" autocomplete="off" maxlength="2000">
      <button type="submit" id="chat-send">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/chat-widget.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
